<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 280" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="wfArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="40" y="45" font-size="15" font-weight="700" fill="#0f172a">Feature 2 Delivery Workflow</text>
  <text x="40" y="62" font-size="10.5" font-weight="500" fill="#64748b">Edge-Assisted Smart Campus Energy Management using Federated Learning</text>

  <!-- 6 Horizontal Pipeline Steps -->
  <!-- Step 1: Telemetry -->
  <rect x="40" y="90" width="135" height="75" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="52" y="118" font-size="12" font-weight="700" fill="#1e293b">Telemetry</text>
  <text x="52" y="136" font-size="9" fill="#64748b">Meters · PV · BESS</text>
  <text x="52" y="149" font-size="9" fill="#15803d">Local 1Hz polling</text>

  <line x1="175" y1="127" x2="198" y2="127" stroke="#16a34a" stroke-width="1.5" marker-end="url(#wfArrow)"/>

  <!-- Step 2: Edge DP Train -->
  <rect x="200" y="90" width="135" height="75" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="212" y="118" font-size="12" font-weight="700" fill="#1e293b">Edge DP Train</text>
  <text x="212" y="136" font-size="9" fill="#64748b">BiLSTM forecaster</text>
  <text x="212" y="149" font-size="9" fill="#15803d">(ε, δ)-DP gradient clip</text>

  <line x1="335" y1="127" x2="358" y2="127" stroke="#16a34a" stroke-width="1.5" marker-end="url(#wfArrow)"/>

  <!-- Step 3: Secure Sync -->
  <rect x="360" y="90" width="135" height="75" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="372" y="118" font-size="12" font-weight="700" fill="#1e293b">Secure Sync</text>
  <text x="372" y="136" font-size="9" fill="#64748b">AWS IoT Core mTLS</text>
  <text x="372" y="149" font-size="9" fill="#15803d">SMPC weight masks</text>

  <line x1="495" y1="127" x2="518" y2="127" stroke="#16a34a" stroke-width="1.5" marker-end="url(#wfArrow)"/>

  <!-- Step 4: FedProx Aggr -->
  <rect x="520" y="90" width="135" height="75" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="532" y="118" font-size="12" font-weight="700" fill="#1e293b">FedProx Aggr</text>
  <text x="532" y="136" font-size="9" fill="#64748b">ECS Fargate task</text>
  <text x="532" y="149" font-size="9" fill="#15803d">Non-IID μ=0.01</text>

  <line x1="655" y1="127" x2="678" y2="127" stroke="#16a34a" stroke-width="1.5" marker-end="url(#wfArrow)"/>

  <!-- Step 5: MPC Optimize -->
  <rect x="680" y="90" width="135" height="75" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="692" y="118" font-size="12" font-weight="700" fill="#1e293b">MPC Optimize</text>
  <text x="692" y="136" font-size="9" fill="#64748b">24h demand schedule</text>
  <text x="692" y="149" font-size="9" fill="#15803d">Peak shaving setpoints</text>

  <line x1="815" y1="127" x2="838" y2="127" stroke="#16a34a" stroke-width="1.5" marker-end="url(#wfArrow)"/>

  <!-- Step 6: BMS Actuate -->
  <rect x="840" y="90" width="135" height="75" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="852" y="118" font-size="12" font-weight="700" fill="#1e293b">BMS Actuate</text>
  <text x="852" y="136" font-size="9" fill="#64748b">Device Shadows</text>
  <text x="852" y="149" font-size="9" fill="#15803d">Modbus/BACnet loops</text>
</svg>